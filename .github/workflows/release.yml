name: Release

# Cut a GitHub release on a version tag:  git tag vX.Y.Z && git push origin vX.Y.Z
# Builds the extension and attaches the Chrome and Firefox zips to the release.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # required to create the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund

      # Tag pushes don't trigger ci.yml, so gate the release on the same checks.
      - name: Check
        run: npm run check

      # SOURCE builds, for both browsers, into web-ext-artifacts/source/.
      #
      # A release page is a public download, so what goes on it must not carry Konode's own
      # Google OAuth client secret: these are the "bring your own OAuth client" variant, and
      # Drive sign-in in them needs the user's own. The zips uploaded to the Chrome Web Store
      # and to AMO are built locally WITH the secret, by hand, and land in
      # web-ext-artifacts/chrome/ and .../firefox/ instead.
      #
      # `package:source` does not merely rely on CI having no .env. It builds through
      # `--mode source`, which blanks the secret via .env.source, and then reads the built
      # bundle back and refuses to zip if a secret is in there after all. That check is the
      # point: the two variants are otherwise indistinguishable once zipped.
      - name: Package (source builds, both browsers)
        run: npm run package:source

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          web-ext-artifacts/source/konode-chrome-*.zip
          web-ext-artifacts/source/konode-firefox-*.zip
          --title "$GITHUB_REF_NAME"
          --generate-notes

# `--generate-notes` only produces a "Full Changelog" compare link, which is not enough on
# its own: a visitor cannot tell the two zips apart, and cannot know that Drive needs their
# own OAuth client in these builds. Replace the body by hand after the run: which download
# for which browser, the Drive caveat, an upgrade note. Take the SHAPE from the v1.2.0
# release, not the words. Both stores are live now, so a body copied verbatim would repeat
# its "waiting on review" and "until the listing is live" lines, which are dead wrong today.
#
# Not done, worth doing: GitHub already publishes a SHA-256 digest per release asset, so the
# download itself is covered. What `npm run checksum` adds is the reproducible part, a
# fingerprint of dist/ someone can regenerate from the tag. It is only worth printing if the
# run that BUILT the asset computes it, which means composing the notes here instead of
# --generate-notes, so it waits for a release where the notes step can actually be tried.
