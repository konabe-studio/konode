name: Release

# Cut a GitHub release on a version tag:  git tag vX.Y.Z && git push origin vX.Y.Z
# Builds the extension and attaches the Chrome and Firefox zips to the release.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # required to create the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund

      # Tag pushes don't trigger ci.yml, so gate the release on the same checks.
      - name: Check
        run: npm run check

      # Source builds: no VITE_GOOGLE_CLIENT_SECRET in CI, so both released zips are the
      # "bring your own OAuth client" variant: Drive sign-in needs the user's own
      # OAuth client. The zips uploaded to the Chrome Web Store and to AMO are built
      # locally WITH the secret, by hand. Keep it that way: the release page is a public
      # download, and these two must not become the same file by accident.
      - name: Package (Chrome)
        run: npm run package:chrome

      # Runtime-verified on Firefox desktop as of 1.2.0, which is what the note here used
      # to be waiting for. `package:firefox` passes --filename, so this lands as
      # konode-firefox-<version>.zip; web-ext's default name (konode-<version>.zip) sat
      # beside the Chrome zip with nothing to tell a downloader which was which.
      - name: Package (Firefox)
        run: npm run package:firefox

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          web-ext-artifacts/konode-chrome-*.zip
          web-ext-artifacts/konode-firefox-*.zip
          --title "$GITHUB_REF_NAME"
          --generate-notes

# `--generate-notes` only produces a "Full Changelog" compare link, which is not enough on
# its own: a visitor cannot tell the two zips apart, and cannot know that Drive needs their
# own OAuth client in these builds. Replace the body by hand after the run: which download
# for which browser, the Drive caveat, an upgrade note. Take the SHAPE from the v1.2.0
# release, not the words. Both stores are live now, so a body copied verbatim would repeat
# its "waiting on review" and "until the listing is live" lines, which are dead wrong today.
#
# Not done, worth doing: GitHub already publishes a SHA-256 digest per release asset, so the
# download itself is covered. What `npm run checksum` adds is the reproducible part, a
# fingerprint of dist/ someone can regenerate from the tag. It is only worth printing if the
# run that BUILT the asset computes it, which means composing the notes here instead of
# --generate-notes, so it waits for a release where the notes step can actually be tried.
